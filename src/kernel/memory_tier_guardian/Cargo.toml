[package]
name = "omnimind-memory-tier-guardian"
version = "0.1.0"
edition = "2021"
authors = ["OmniMind Sovereign Federation <omnimind@kernel.local>"]
description = "High-performance compiled Rust port of memory_tier_guardian"
license = "CC-BY-NC-ND-4.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
