[package]
name = "omnimind-sovereign-kuramoto"
version = "0.1.0"
edition = "2021"
authors = ["OmniMind Sovereign Federation <omnimind@kernel.local>"]
description = "Sovereign Kuramoto Solver + Psychoanalytic LIF + Hopf Bifurcation Monitor — clean-room, AGPL-free"
license = "CC-BY-NC-ND-4.0"

[lib]
name = "omnimind_sovereign_kuramoto"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
ndarray = "0.15"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
