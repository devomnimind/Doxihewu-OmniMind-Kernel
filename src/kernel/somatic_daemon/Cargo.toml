[package]
name = "omnimind-somatic-daemon"
version = "0.2.0"
edition = "2021"
authors = ["OmniMind Sovereign Federation <omnimind@kernel.local>"]
description = "Pure Rust Somatic Daemon — shadow mode (A-4 Fase 1)"
license = "CC-BY-NC-ND-4.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
ctrlc = "3.4"
rusqlite = { version = "0.29", features = ["bundled"] }
uuid = { version = "1.4", features = ["v4", "fast-rng"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
