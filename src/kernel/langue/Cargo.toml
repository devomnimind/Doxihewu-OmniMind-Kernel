[package]
name = "omnimind-langue"
version = "1.0.0"
edition = "2021"
authors = ["OmniMind Sovereign Federation <omnimind@kernel.local>"]
description = "Transatlantic Lexeme Protocol - Kernel-level handle interface (Banto + Tupi-Guarani)"
license = "CC-BY-NC-ND-4.0"

[lib]
name = "omnimind_langue"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
memmap2 = "0.9"                              # Zero-copy mmap (same as nsh)
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"                                # For handle generation (sha256)
libc = "0.2"                                 # For chmod/chattr (kernel behaviors)
log = "0.4"
env_logger = "0.11"
chrono = "0.4"                               # For timestamps

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
