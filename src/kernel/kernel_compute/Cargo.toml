[package]
name = "omnimind-kernel-compute"
version = "0.1.0"
edition = "2021"
authors = ["OmniMind Sovereign Federation <omnimind@kernel.local>"]
description = "Hot-path compute primitives migrated from integration_loop.py — drop-in compatible with Python fallback"
license = "CC-BY-NC-ND-4.0"

[lib]
name = "omnimind_kernel_compute"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
ndarray = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
