[package]
name = "omnimind-sovereign-daemon"
version = "0.1.0"
edition = "2021"
authors = ["OmniMind Sovereign Federation <omnimind@kernel.local>"]
description = "Pure Rust Sovereign Daemon Core — Shadow Mode (A-3 Fase 1)"
license = "CC-BY-NC-ND-4.0"

[dependencies]
tokio = { version = ">=1.38.0, <2.0", features = ["macros", "rt-multi-thread", "time", "signal", "fs", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.29", features = ["bundled"] }
uuid = { version = "1.4", features = ["v4"] }
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
